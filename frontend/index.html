<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Connect 4</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<main>
			<h1>CONNECT&nbsp;4</h1>

			<div id="scoreboard">
				<div class="score you"><span class="dot"></span><b id="s-you">0</b><small>You</small></div>
				<div class="score ai"><span class="dot"></span><b id="s-ai">0</b><small>AI</small></div>
				<div class="score draw"><b id="s-draw">0</b><small>Draws</small></div>
			</div>

			<div id="board"></div>

			<p id="status">Your turn…</p>
			<p id="message"></p>

			<div id="controls">
				<button id="new">⟳ New Game</button>
				<button id="undo">↶ Undo</button>
				<button id="theme">☀️ Light</button>
				<span class="moves">Moves: <b id="move-count">0</b></span>
			</div>

			<div id="settings">
				<label>Your colour
					<select id="color">
						<option value="red">Red</option>
						<option value="yellow">Yellow</option>
					</select>
				</label>
				<label>First move
					<select id="first">
						<option value="you">You</option>
						<option value="ai">AI</option>
					</select>
				</label>
				<label>Difficulty
					<select id="difficulty">
						<option value="easy">Easy</option>
						<option value="medium" selected>Medium</option>
						<option value="hard">Hard</option>
					</select>
				</label>
				<small class="hint">Applied on New Game</small>
			</div>
		</main>
		<script src="script.js"></script>
	</body>
</html>
